[project]
name = "jarvis"
version = "0.1.0"
description = "Serveur local Jarvis AIOS et socle de routage LLM"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["reel: appelle les vrais moteurs"]
addopts = '-m "not reel" -q'
