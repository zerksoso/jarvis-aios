name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Une release construite et testée en local (commit marqué « [release-locale] ») est publiée à la main : pas de double build.
    if: ${{ !contains(github.event.head_commit.message, '[release-locale]') }}
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Installer Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Extraire la version du tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag invalide '$($env:GITHUB_REF_NAME)' : format attendu vX.Y.Z"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Construire le runtime Python embarqué
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File distrib\build_runtime.ps1 -Sortie build\python

      - name: Construire les artefacts de release
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File distrib\build_release.ps1 -Version $env:RELEASE_VERSION

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/manifest.json
            dist-release/JarvisAIOS-app-${{ env.RELEASE_VERSION }}.zip
            dist-release/JarvisAIOS-Setup-${{ env.RELEASE_VERSION }}.exe
          generate_release_notes: true
